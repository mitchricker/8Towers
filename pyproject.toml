[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eight_towers"
version = "0.1.0"
description = "An esoteric virtual machine."
readme = "docs/theory.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
8t = "ui.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eight_towers*", "ui*"]

# ----------------------------------------------------------------------
# Pytest Configuration
# Fixes ModuleNotFoundError by adding the root path automatically
# ----------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"